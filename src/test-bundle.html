<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bundle checkout test (temporary — not part of Scammer Scan or RichLab)</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 18px; }
  .warning { background: #fff3cd; border: 1px solid #ffdd57; padding: 10px 14px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; }
  label { display: block; margin-top: 16px; font-size: 14px; font-weight: 600; }
  input { width: 100%; padding: 8px; margin-top: 4px; font-size: 15px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 16px; font-size: 15px; cursor: pointer; margin-right: 8px; }
  pre { background: #f4f4f4; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; margin-top: 16px; white-space: pre-wrap; }
  .buy { background: #1a1a1a; color: white; border: none; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Bundle checkout test</h1>
  <div class="warning">Temporary test page, not linked from anywhere. Delete this file once the real payment flow is verified. Uses REAL PayFast — this is a real R100 charge.</div>

  <label for="phone">Phone number (used as the identity key — use the same one each time)</label>
  <input id="phone" type="text" placeholder="+27821234567" />

  <button id="checkBalance">Check balance</button>
  <button id="buyBundle" class="buy">Buy 25 checks — R100</button>

  <pre id="output">Results will appear here.</pre>

<script>
  const BACKEND = "https://bs-detector-backend-production.up.railway.app";
  const output = document.getElementById("output");
  const phoneInput = document.getElementById("phone");

  function log(label, data) {
    output.textContent = `${label}:\n${JSON.stringify(data, null, 2)}`;
  }

  document.getElementById("checkBalance").addEventListener("click", async () => {
    const phone = phoneInput.value.trim();
    if (!phone) return log("Error", "Enter a phone number first.");
    output.textContent = "Checking...";
    try {
      const res = await fetch(`${BACKEND}/api/check-balance`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone }),
      });
      const data = await res.json();
      log(`Balance (HTTP ${res.status})`, data);
    } catch (err) {
      log("Fetch error", err.message);
    }
  });

  document.getElementById("buyBundle").addEventListener("click", async () => {
    const phone = phoneInput.value.trim();
    if (!phone) return log("Error", "Enter a phone number first.");
    output.textContent = "Starting checkout...";
    try {
      const res = await fetch(`${BACKEND}/api/create-bundle-checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone }),
      });
      const data = await res.json();
      if (!res.ok) return log(`Checkout failed (HTTP ${res.status})`, data);

      // PayFast requires a real HTML form submission (browser redirect),
      // not a fetch — so we build one on the fly and submit it.
      const form = document.createElement("form");
      form.method = "POST";
      form.action = data.processUrl;
      for (const [key, value] of Object.entries(data.fields)) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = value;
        form.appendChild(input);
      }
      document.body.appendChild(form);
      form.submit(); // this navigates away to PayFast
    } catch (err) {
      log("Fetch error", err.message);
    }
  });
</script>
</body>
</html>
